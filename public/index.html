  :root {
    --bg: #000000;
    --ink: #e6e6e6;      /* digits when running */
    --dim: #555555;      /* clock + captions */
    --line: #1e1e1e;     /* button borders */
    --btn: #8a8a8a;      /* button text */
  }

  /* Night mode: same layout, much lower luminance for dim rooms. */
  body.night {
    --ink: #4a4a4a;
    --dim: #2a2a2a;
    --line: #151515;
    --btn: #4a4a4a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono",
                 Menlo, Consolas, monospace;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body.idle { cursor: none; }

  /* Shared geometry for the clock (top) and stopwatch (bottom) */
  .display {
    display: inline-flex;
    align-items: flex-start;
    font-size: clamp(2.7rem, min(30.5vw, 27vh), 36rem);
    font-weight: 500;
    line-height: 0.9;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1, "zero" 1;
    transition: opacity 300ms ease, color 300ms ease;
  }
  /* The clock: current 24h time, always dimmed and static. */
  #clock {
    color: var(--dim);
    margin-bottom: 0.14em;
  }
  body.paused #time { opacity: 0.42; }
  /* Night mode is already dim, so don't compound the paused fade as heavily. */
  body.night.paused #time { opacity: 0.55; }

  .display .seg {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
  }
  .display .num { line-height: 0.9; }

  /* Running indicator: the colon subtly pulses while the stopwatch is running. */
  .display .colon { transform: translateY(-0.09em); }
  @keyframes colonPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.5; }
  }
  /* Animate regardless of the OS reduce-motion setting: this is the requested
     activity indicator, so it must stay visible. */
  body:not(.paused) #time .colon {
    animation: colonPulse 6.4s ease-in-out infinite;
  }

  /* State caption + controls, fade out when idle */
  #panel {
    position: fixed;
    bottom: max(4vh, 1.5rem);
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
    opacity: 1;
    transition: opacity 400ms ease;
  }
  body.idle #panel { opacity: 0; pointer-events: none; }

  #state {
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--dim);
    padding-left: 0.35em; /* balance the letter-spacing */
  }

  #controls {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 1rem;
  }

  button {
    background: transparent;
    color: var(--btn);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.55rem 1.2rem;
    font: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: border-color 150ms ease, color 150ms ease;
  }
  button:hover { color: var(--ink); border-color: #3a3a3a; }
  button:focus-visible { outline: 2px solid #4a4a4a; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #time, #panel { transition: none; }
  }
</style>
</head>
<body class="paused">
  <div id="clock" class="display"><span class="seg"><span class="num" id="ch">00</span></span><span class="colon">:</span><span class="seg"><span class="num" id="cm">00</span></span></div>
  <div id="time" class="display"><span class="seg"><span class="num" id="th">00</span></span><span class="colon">:</span><span class="seg"><span class="num" id="tm">00</span></span></div>

  <div id="panel">
    <div id="state">Paused</div>
    <div id="controls">
      <button id="startBtn" type="button">Start</button>
      <button id="resetBtn" type="button">Reset</button>
      <button id="nightBtn" type="button">Night mode</button>
      <button id="fsBtn" type="button">Fullscreen</button>
    </div>
  </div>

<script>
(function () {
  var running = false;
  var accumulated = 0;      // ms banked from previous runs
  var startTs = 0;          // performance.now() at last start
  var night = false;
  var lastMain = "";
  var lastCh = "", lastCm = "";
  var tick = null;

  var thEl     = document.getElementById("th");
  var tmEl     = document.getElementById("tm");
  var chEl     = document.getElementById("ch");
  var cmEl     = document.getElementById("cm");
  var stateEl  = document.getElementById("state");
  var startBtn = document.getElementById("startBtn");
  var resetBtn = document.getElementById("resetBtn");
  var nightBtn = document.getElementById("nightBtn");
  var fsBtn    = document.getElementById("fsBtn");
  var wakeLock = null;

  function elapsed() {
    return running ? accumulated + (performance.now() - startTs) : accumulated;
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function render() {
    var total = Math.floor(elapsed() / 1000);
    var ph = pad(Math.floor(total / 3600));
    var pm = pad(Math.floor((total % 3600) / 60));
    var main = ph + pm;
    if (main !== lastMain) {
      thEl.textContent = ph;
      tmEl.textContent = pm;
      lastMain = main;
    }
  }

  function loop() {
    render();
    // Poll often enough to catch the minute rollover promptly;
    // the DOM only changes when the visible string actually changes.
    tick = setTimeout(loop, 500);
  }
  function startLoop() { if (!tick) loop(); }
  function stopLoop() { if (tick) { clearTimeout(tick); tick = null; } }

  async function requestWake() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) { /* not available (e.g. file://) — harmless */ }
  }
  function releaseWake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }

  function setRunning(on) {
    running = on;
    document.body.classList.toggle("paused", !on);
    stateEl.textContent = on ? "Running" : "Paused";
    startBtn.textContent = on ? "Pause" : "Start";
    if (on) { requestWake(); startLoop(); }
    else    { releaseWake(); stopLoop(); render(); }
  }

  function toggle() {
    if (running) {
      accumulated += performance.now() - startTs;
      setRunning(false);
    } else {
      startTs = performance.now();
      setRunning(true);
    }
  }

  function reset() {
    if (running) setRunning(false);
    accumulated = 0;
    lastMain = "";
    render();
  }

  function toggleNight() {
    night = !night;
    document.body.classList.toggle("night", night);
    nightBtn.textContent = night ? "Day mode" : "Night mode";
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
    } else {
      (document.exitFullscreen || function(){}).call(document);
    }
  }

  // Buttons
  startBtn.addEventListener("click", toggle);
  resetBtn.addEventListener("click", reset);
  nightBtn.addEventListener("click", toggleNight);
  fsBtn.addEventListener("click", toggleFullscreen);

  // Keyboard: Space start/stop, R reset, N night, F fullscreen
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "BUTTON" && e.key !== " ") return;
    var k = e.key.toLowerCase();
    if (e.key === " " || e.code === "Space") { e.preventDefault(); toggle(); }
    else if (k === "r") { reset(); }
    else if (k === "n") { toggleNight(); }
    else if (k === "f") { toggleFullscreen(); }
  });

  // Re-acquire wake lock after tab/display comes back
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && running) requestWake();
  });

  // Auto-hide cursor + controls when idle
  var idleTimer = null;
  function wake() {
    document.body.classList.remove("idle");
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add("idle"); }, 3000);
  }
  ["mousemove", "mousedown", "touchstart", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, wake, { passive: true });
  });
  // Wall clock (24h), always running independently of the stopwatch state.
  function updateClock() {
    var now = new Date();
    var hh = pad(now.getHours());   // getHours() is 24-hour
    var mm = pad(now.getMinutes());
    if (hh !== lastCh) { chEl.textContent = hh; lastCh = hh; }
    if (mm !== lastCm) { cmEl.textContent = mm; lastCm = mm; }
  }
  updateClock();
  setInterval(updateClock, 1000);

  wake();
  render();
})();
</script>
</body>
</html>
